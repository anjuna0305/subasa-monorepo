name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: api-gateway (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/api-gateway/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q
        env:
          # config.py refuses to start without a real secret; these are
          # throwaway CI values, and the suite runs against SQLite.
          JWT_SECRET: ci-secret-long-enough-to-pass-the-length-check
          APP_ENV: development
          CORS_ALLOW_ORIGINS: "http://localhost:5173"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

  services-lint:
    name: model services (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install ruff==0.15.4

      # The model services cannot be imported without gigabytes of checkpoints,
      # so they are linted rather than tested here; their smoke tests run
      # against a deployed stack (see docs/TESTING.md).
      - name: Lint
        run: ruff check backend/ASR backend/TTS backend/chatbot-modified backend/framework backend/shared backend/tests

  frontend:
    name: new-chat-app (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/new-chat-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/new-chat-app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches drift between compose and the Dockerfiles/build contexts
      # without paying for a full image build.
      - name: Validate compose file
        run: docker compose --env-file .env.example config --quiet
