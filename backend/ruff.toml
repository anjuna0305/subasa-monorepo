line-length = 100
# framework runs on 3.9 and the other services on 3.10, so no 3.11+ rewrites.
target-version = "py39"

# The vendored Coqui TTS library is third-party code, not ours to restyle.
exclude = ["TTS/TTS", "TTS/TTS.egg-info"]

[lint]
# Correctness rules only. The "UP" modernisation rules are deliberately off
# here: these three services target Python 3.9, 3.10 and 3.13 respectively, so
# a rewrite that is correct for one can break another. The api-gateway, which
# is 3.13 only, enables them in its own ruff.toml.
select = ["E", "F", "B", "W"]
ignore = [
    "E501",  # long lines are mostly user-facing Sinhala strings
    "B008",  # FastAPI's Depends()/File() defaults are the framework idiom
]
