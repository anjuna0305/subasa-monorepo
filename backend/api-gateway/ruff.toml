line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",  # long lines are mostly user-facing Sinhala error strings
    "B008",  # FastAPI's Depends()/File() defaults are the framework idiom
    "UP042", # str+Enum is deliberate: SQLAlchemy stores the .value
]

[lint.per-file-ignores]
# Test env vars must be set before the app modules are imported.
"tests/conftest.py" = ["E402"]
# Alembic generates these; they are not hand-maintained.
"alembic/**" = ["E402", "W291"]
